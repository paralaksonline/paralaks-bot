name: PARALAKS Haber Masası

on:
  schedule:
    # Private repo (2000 dk/ay ücretsiz) için güvenli aralık: 30 dk -> ~1440 dk/ay.
    # Repo PUBLIC ise dakika sınırsızdır; "*/10 * * * *" yapabilirsiniz.
    # Not: GitHub zamanlanmış işleri yoğunlukta 5-20 dk geciktirebilir.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # state.json'u repoya geri yazmak için

concurrency:
  group: paralaks-bot
  cancel-in-progress: false   # iki çalıştırma aynı anda state.json'a yazmasın

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Botu çalıştır
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Repo > Settings > Secrets and variables > Actions > Variables sekmesinden değiştirilebilir
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'gemini' }}
          LISTEN_SECONDS: ${{ vars.LISTEN_SECONDS || '0' }}
        run: python bot.py

      - name: state.json'u kaydet
        if: always()
        run: |
          git config user.name "paralaks-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "state.json değişmedi"
            exit 0
          fi
          git commit -m "state: güncelle [skip ci]"
          git pull --rebase --autostash || true
          git push
